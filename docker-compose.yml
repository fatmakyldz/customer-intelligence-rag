version: '3.9'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag_postgres
    environment:
      POSTGRES_DB: ragdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/database/init.sql:/docker-entrypoint-initdb.d/00_init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ragdb']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag_backend
    ports:
      - '3001:3001'
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ragdb
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
    container_name: rag_frontend
    ports:
      - '3002:3000'
    environment:
      NODE_ENV: production
    depends_on:
      - backend
    restart: on-failure

volumes:
  postgres_data:
